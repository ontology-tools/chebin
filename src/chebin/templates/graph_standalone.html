<style>
.graph-wrapper {

  border: 1px solid #b0b0b0;

}

  border-radius: 5px;

  border-radius: 4px 4px 0 0;
  padding: 4px 8px;
  margin-bottom: 8px;
  font-weight: bold;
  color: #555;
}

#p-filter > *:not(.p-filter-handle) {

}

<div class="graph-wrapper">

<script>
    Promise.resolve(window.__CHEBIN_GRAPH_DATA__)
    .then(data => {
        const cy = cytoscape({
            container: document.getElementById('cy'),
            elements: data.elements,

            selectionType: 'additive', // Allow multiple node selection

            style: [
                {
                    selector: 'node',
                    style: {
                        'background-color': 'data(color)',
                        'label': 'data(short_label)',
                        'width': 30,
                        'height': 30,
                        'font-size': 10,
                        'text-valign': 'bottom',
                        'text-halign': 'center',
                        'color': '#000',
                        'border-width': 1,
                        'border-color': '#555'

                    }
                },
                // Style for selected nodes
                {
                    selector: 'node:selected',
                    style: {
                        'border-width': 5,
                        'border-color': '#0540e3' // Blue color for selected nodes
                    }
                },

                {
                    selector: 'edge',
                    style: {
                        'width': 2,
                        'line-color': '#888',
                        'target-arrow-color': '#888',
                        'target-arrow-shape': 'triangle',
                        'curve-style': 'bezier'
                    }
                }
            ],
            layout: {
                name: 'cose',
                directed: true,
                padding: 10,
            }
        });

        let labelsVisible = true;

        // Flip the graph vertically to have roots at the top
        cy.nodes().forEach(node => {
            const pos = node.position();
            node.position({ x: pos.x, y: -pos.y });
        });

        // Center the graph in the viewport
        cy.fit(50); // 50px padding

        // Single source of truth for "the" p-value of a node: corrected if
        // available, else raw.
        const getP = node => node.data('p_value_corrected') ?? node.data('p_value');

        /////////
        // Links to ChEBI
        /////////

        // ChEBI's own entry page. The older searchId.do / chebiOntology.do query
        // forms still work but only as redirects to this one, so link it directly.
        // The colon is deliberately not percent-encoded: /chebi/CHEBI%3A15377 404s
        // where /chebi/CHEBI:15377 resolves.
        const CHEBI_ENTRY_URL = 'https://www.ebi.ac.uk/chebi/';

        // Nodes carry `chebi_id` as a CURIE ("CHEBI:15377"). Graph JSON written
        // before that field existed does not, so fall back to the node's own id --
        // the OBO IRI ".../CHEBI_15377" -- which keeps already-exported pages and
        // still-open sessions working. A node that is neither stays unlinked rather
        // than pointing somewhere wrong.
        const chebiId = node => {
            const curie = node.data('chebi_id');
            if (typeof curie === 'string' && /^CHEBI:\d+$/.test(curie)) return curie;

            const match = /CHEBI[_:](\d+)$/.exec(node.data('id') ?? '');
            return match === null ? null : 'CHEBI:' + match[1];
        };

        const chebiUrl = node => {
            const id = chebiId(node);
            return id === null ? null : CHEBI_ENTRY_URL + id;
        };

        // Opened in a new tab so the graph -- its layout, selection and filters --
        // survives the trip to ChEBI.
        const openChebiEntryFor = node => {
            const url = chebiUrl(node);
            if (url !== null) window.open(url, '_blank', 'noopener');
        };

        // Names come from ChEBI and are dropped into innerHTML below; a few contain
        // characters that would otherwise be read as markup.
        const escapeHtml = text => String(text ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');

        // The tooltip's title line: the node's label with its ChEBI id linked, so
        // "D-glucoside (CHEBI:35436)" carries the link on "CHEBI:35436" itself.
        // Only the id is a link, not the whole title: the name stays selectable text.
        const titleHtml = node => {
            const id = chebiId(node);
            const label = escapeHtml(String(node.data('label') ?? '').replace('CHEBI_', 'CHEBI:'));
            if (id === null) return '<b>' + label + '</b>';

            const link = '<a href="' + chebiUrl(node) + '" target="_blank" rel="noopener">' + id + '</a>';
            const name = escapeHtml(String(node.data('short_label') ?? '').trim());

            // A node with no name is labelled by its id alone -- nothing to bracket.
            return name === '' || name === id
                ? '<b>' + link + '</b>'
                : '<b>' + name + ' (' + link + ')</b>';
        };

        // How long the tooltip survives the pointer leaving the node. It sits still
        // and flush against the node, so reaching the ChEBI link inside it is a short
        // move onto an adjacent box -- and arriving cancels the countdown entirely.
        // This does not need to be generous.
        const TOOLTIP_HIDE_DELAY_MS = 600;

        // A node's ChEBI entry also opens on double-click. Cytoscape's own
        // single-click selection is left alone; it drives the show/hide filters.
        cy.on('dbltap', 'node', evt => openChebiEntryFor(evt.target));

        /////////
        // Colouring
        /////////

        const colourScaleMode = 'relative'; // 'absolute' or 'relative'

        const absoluteMaxExponent = 4; // Color saturation point: p >= 1e-maxExponent all map to max significance

        if (colourScaleMode === 'relative') {
            // Determine max exponent from data
            var maxExponent = 0;
            cy.nodes().forEach(node => {
                const p = getP(node);
                if (p != null && p > 0) {
                    const exponent = -Math.log10(p);
                    if (exponent > maxExponent) {
                        maxExponent = exponent;
                    }
                }
            });
        } else if (colourScaleMode === 'absolute') {
            var maxExponent = absoluteMaxExponent;
        } else {
            throw new Error("Invalid colour scale mode");
        }

        // Update legend
        document.getElementById('legend-max').textContent =
            `High (p ≤ ${Math.pow(10, -maxExponent).toExponential(1) })`;

        const titleDiv = document.getElementById('legend-title');

        if (colourScaleMode === 'relative') {
            titleDiv.innerHTML = '<h4 class="mb-1">Significance (relative)</h4>';
        } else {
            titleDiv.innerHTML = '<h4 class="mb-1">Significance</h4>';
        }



        // Convert hex to RGB
        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            return {
                r: parseInt(hex.substring(0, 2), 16),
                g: parseInt(hex.substring(2, 4), 16),
                b: parseInt(hex.substring(4, 6), 16)
            };
        }

        // Linear interpolation between two colors
        function interpolateColor(colorLow, colorHigh, t) {
            const c1 = hexToRgb(colorLow);
            const c2 = hexToRgb(colorHigh);

            const r = Math.round(c1.r + (c2.r - c1.r) * t);
            const g = Math.round(c1.g + (c2.g - c1.g) * t);
            const b = Math.round(c1.b + (c2.b - c1.b) * t);
            return `rgb(${r},${g},${b})`;
        }

        // Update node colors based on p-value
        const colorLow = "#ca3900";
        const colorHigh = "#ffffff";

        cy.nodes().forEach(node => {
            const p = getP(node);

            let color = "lightgrey"; // default color

            if (p != null) {
                const exponent = -Math.log10(p);
                let t = exponent / maxExponent;
                t = 1 - t; // Invert t so that low p-values are high t
                t = Math.max(0, Math.min(1, t)); // Clamp t between 0 and 1

                color = interpolateColor(colorLow, colorHigh, t);
      }

            node.style('background-color', color);
        });


        // Node hover tooltip.
        //
        // Hand-rolled rather than qTip2, which this page used to use through the
        // cytoscape-qtip extension. The tooltip's title carries a link to ChEBI, so
        // it has to survive the pointer leaving the node and travelling onto it --
        // and that is exactly what cytoscape-qtip cannot do: it binds hide.event as
        // a Cytoscape event and calls qtipApi.hide() itself, so qTip2's own
        // hide.fixed and hide.delay never run and the tooltip closes the instant the
        // pointer leaves the node. It also hid on every pan and zoom by default.
        const tooltip = document.createElement('div');
        tooltip.id = 'node-tooltip';
        document.body.appendChild(tooltip);

        // Format to 2 decimal places in exponential notation (gives 3 significant figures)
        const formatP = (value) => value != null ? value.toExponential(2) : 'N/A';

        let hideTimer = null;

        const hideTooltip = () => {
            clearTimeout(hideTimer);
            tooltip.style.display = 'none';
        };

        const scheduleHide = () => {
            clearTimeout(hideTimer);
            hideTimer = setTimeout(
                () => { tooltip.style.display = 'none'; },
                TOOLTIP_HIDE_DELAY_MS,
            );
        };

        tooltip.addEventListener('mouseenter', () => clearTimeout(hideTimer));
        tooltip.addEventListener('mouseleave', scheduleHide);

        // Parked against the node and left there. It used to follow the cursor, which
        // made the link in it something you chased rather than something you aimed
        // at. It sits flush against the node's right edge -- touching it, so the
        // pointer never crosses bare canvas on the way -- flipping to the left and
        // clamping upwards only when it would otherwise leave the viewport.
        const placeTooltipBy = (node) => {
            const rect = document.getElementById('cy').getBoundingClientRect();

            // The node's own circle, not renderedBoundingBox(): that includes the
            // node's label by default, and the labels sit under the nodes and are far
            // wider than the 30px circle, which left the tooltip parked out beside
            // the text rather than against the node.
            const centre = node.renderedPosition();
            const halfWidth = node.renderedOuterWidth() / 2;
            const halfHeight = node.renderedOuterHeight() / 2;

            // Breathing room against the window edge only, never against the node.
            const edge = 8;

            // Real measurements: the caller has already set the content and made the
            // tooltip visible.
            const width = tooltip.offsetWidth;
            const height = tooltip.offsetHeight;

            let left = rect.left + centre.x + halfWidth;
            if (left + width > window.innerWidth - edge) {
                left = rect.left + centre.x - halfWidth - width;
            }

            let top = rect.top + centre.y - halfHeight;
            if (top + height > window.innerHeight - edge) {
                top = window.innerHeight - height - edge;
            }

            tooltip.style.left = Math.max(edge, left) + 'px';
            tooltip.style.top = Math.max(edge, top) + 'px';
        };

        cy.on('mouseover', 'node', (evt) => {
            const node = evt.target;
            clearTimeout(hideTimer);

            tooltip.innerHTML =
                titleHtml(node) + '<br>' +
                'p-value: ' + formatP(node.data('p_value')) + '<br>' +
                'corr. p-value: ' + formatP(node.data('p_value_corrected'));

            tooltip.style.display = 'block';
            placeTooltipBy(node);
        });

        cy.on('mouseout', 'node', scheduleHide);

        // The tooltip is clickable, so a stale one left sitting over the graph would
        // swallow clicks meant for the nodes underneath. Touching the graph itself
        // dismisses it immediately, whatever is left of the delay.
        cy.on('tap pan zoom', hideTooltip);

        // Custom context menu div
        const contextMenu = document.createElement('div');
        contextMenu.id = 'context-menu';
        contextMenu.style.cssText = 'position:absolute; display:none; background:white; border:1px solid #ccc; box-shadow:2px 2px 5px rgba(0,0,0,0.2); z-index:1000; padding:5px 0;';
        document.body.appendChild(contextMenu);

        let selectedNode = null;

        cy.on('cxttap', 'node', function(evt){
            evt.preventDefault();
            selectedNode = evt.target;

            // Position menu at mouse coordinates
            contextMenu.style.left = evt.originalEvent.pageX + 'px';
            contextMenu.style.top = evt.originalEvent.pageY + 'px';

            //// Build menu content
            // const pValue = selectedNode.data('p_value');
            // const pValueCorr = selectedNode.data('p_value_corrected');

            contextMenu.innerHTML = `
                <div style="padding:8px 16px; cursor:pointer; hover:background:#f0f0f0;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='white'" onclick="window.selectNode()">Select node</div>
                <div style="padding:8px 16px; cursor:pointer;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='white'" onclick="window.selectNeighbors()">Select first neighbors</div>
                <div style="padding:8px 16px; cursor:pointer;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='white'" onclick="window.selectDescendants()">Select descendants</div>
            `;

            contextMenu.style.display = 'block';
        });

        // Hide menu when clicking elsewhere
        document.addEventListener('click', function() {
            contextMenu.style.display = 'none';
        });

        // Menu actions
        window.selectNode = function() {
            if (selectedNode) selectedNode.select();
            contextMenu.style.display = 'none';
        };

        // window.showDetails = function() {
        //     if (selectedNode) {
        //         const pValue = selectedNode.data('p_value');
        //         const pValueCorr = selectedNode.data('p_value_corrected');
        //         alert(`Node: ${selectedNode.data('label')}\np-value: ${pValue?.toExponential(2) || 'N/A'}\nCorrected p-value: ${pValueCorr?.toExponential(2) || 'N/A'}`);
        //     }
        //     contextMenu.style.display = 'none';
        // };

        window.selectNeighbors = function() {
            if (selectedNode) {
                selectedNode.neighborhood().select();
            }
            contextMenu.style.display = 'none';
        };

        window.selectDescendants = function() {
            if (selectedNode) {
                // Select all descendants (this will be predecessors due to the directed nature of the graph)
                const descendants = selectedNode.predecessors();
                descendants.select();
            }
            contextMenu.style.display = 'none';
        };

        // Main menu actions

        // Computes the legend's layout (sizes, fonts, text) relative to the
        // exported image's height, instead of fixed pixel sizes — so the legend
        // stays proportional whether the exported graph is tiny or huge.
        function computeLegendLayout(imgHeight) {
            const titleText = colourScaleMode === 'relative' ? 'Significance (relative)' : 'Significance';
            const highLabel = `High (p ≤ ${Math.pow(10, -maxExponent).toExponential(1)})`;
            const lowLabel = 'Low';
            const captionText = '(−log₁₀ scale)';

            const gradHeight = Math.max(70, Math.min(180, imgHeight * 0.22));
            const gradWidth = gradHeight * 0.15;
            const titleFontSize = gradHeight * 0.1;
            const labelFontSize = gradHeight * 0.085;
            const gap = gradHeight * 0.08;
            const gradTop = titleFontSize + gap;

            // Use a throwaway canvas just to measure text widths before sizing the real one.
            const measureCtx = document.createElement('canvas').getContext('2d');
            measureCtx.font = `${titleFontSize}px sans-serif`;
            const titleWidth = measureCtx.measureText(titleText).width;
            measureCtx.font = `bold ${labelFontSize}px sans-serif`;
            const labelsWidth = Math.max(measureCtx.measureText(highLabel).width, measureCtx.measureText(lowLabel).width);
            measureCtx.font = `${labelFontSize}px sans-serif`;
            const captionWidth = measureCtx.measureText(captionText).width;

            return {
                titleText, highLabel, lowLabel, captionText,
                gradWidth, gradHeight, gradTop, titleFontSize, labelFontSize, gap,
                width: Math.ceil(Math.max(titleWidth, gradWidth + gap + labelsWidth, captionWidth)),
                height: Math.ceil(gradTop + gradHeight + gap + labelFontSize),
            };
        }

        // Draws the same color-legend shown on screen (#color-legend) onto a canvas
        // context, since cy.png()/cy.jpeg() only rasterize the graph itself.
        function drawLegend(ctx, x, y, layout) {
            ctx.save();
            ctx.translate(x, y);
            ctx.textBaseline = 'top';

            // Not bold — matches the <h4> heading weight used on the website (#color-legend h4).
            ctx.font = `${layout.titleFontSize}px sans-serif`;
            ctx.fillStyle = '#000';
            ctx.fillText(layout.titleText, 0, 0);

            // Gradient bar (matches .legend-gradient in styles.css: high significance at top)
            const gradient = ctx.createLinearGradient(0, layout.gradTop, 0, layout.gradTop + layout.gradHeight);
            gradient.addColorStop(0, 'rgba(202, 57, 0, 1)');
            gradient.addColorStop(1, 'rgba(202, 57, 0, 0.1)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, layout.gradTop, layout.gradWidth, layout.gradHeight);
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, layout.gradTop, layout.gradWidth, layout.gradHeight);

            // Labels next to the gradient bar (bold, matches .legend-labels in styles.css)
            ctx.font = `bold ${layout.labelFontSize}px sans-serif`;
            ctx.fillStyle = '#000';
            ctx.fillText(layout.highLabel, layout.gradWidth + layout.gap, layout.gradTop);
            ctx.fillText(layout.lowLabel, layout.gradWidth + layout.gap, layout.gradTop + layout.gradHeight - layout.labelFontSize);

            // Caption below
            ctx.font = `${layout.labelFontSize}px sans-serif`;
            ctx.fillStyle = '#6c757d';
            ctx.fillText(layout.captionText, 0, layout.gradTop + layout.gradHeight + layout.gap);

            ctx.restore();
        }

        // Export graph: optionally composites the on-screen legend onto the exported
        // image, alongside the full graph (cy's {full:true} captures the whole graph
        // regardless of current pan/zoom, which a DOM screenshot would not).
        function exportGraphWithLegend(format) {
            const scale = 2;
            const includeLegend = document.getElementById('exportIncludeLegend').checked;
            const rawData = format === 'jpeg'
                ? cy.jpeg({ full: true, scale, quality: 0.9 })
                : cy.png({ full: true, scale });

            const downloadDataUrl = (dataUrl) => {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = `graph.${format}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            if (!includeLegend) {
                downloadDataUrl(rawData);
                return;
            }

            const img = new Image();
            img.onload = () => {
                const padding = 16;
                const layout = computeLegendLayout(img.height);

                const canvas = document.createElement('canvas');
                canvas.width = img.width + layout.width + padding * 2;
                canvas.height = Math.max(img.height, layout.height + padding * 2);

                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);

                drawLegend(ctx, img.width + padding, padding, layout);

                const mimeType = format === 'jpeg' ? 'image/jpeg' : 'image/png';
                const combinedData = format === 'jpeg' ? canvas.toDataURL(mimeType, 0.9) : canvas.toDataURL(mimeType);
                downloadDataUrl(combinedData);
            };
            img.src = rawData;
        }

        document.querySelectorAll('.export-option').forEach(item => {
            item.addEventListener('click', e => {
                e.preventDefault(); // stop link navigation
                const format = e.target.dataset.format;
                if (format === 'png' || format === 'jpeg') {
                    exportGraphWithLegend(format);
                }
            });
        });

        // Layout change
        document.querySelectorAll('.layout-option').forEach(item => {
        item.addEventListener('click', e => {
            e.preventDefault(); // stop link navigation

            const layoutName = e.target.dataset.layout;

            cy.layout({
                name: layoutName,
                directed: true,
                padding: 10,
            }).run();

            // Flip the graph vertically to have roots at the top
            cy.nodes().forEach(node => {
                const pos = node.position();
                node.position({ x: pos.x, y: -pos.y });
            });

            // Center the graph in the viewport
            cy.fit(50); // 50px padding
        });
        });

        /////////
        // Visibility
        /////////

        // Current client-side view filter state.
        let pThreshold      = 0.05;   // hide nodes whose p-value exceeds this
        let keepPathsToRoot = true;   // keep ancestors so survivors stay connected

        // Walk upward (outgoers = parents in this directed graph) collecting
        // ancestors. Memoised on entry, so shared spines are visited once and
        // any cycle terminates.
        function collectAncestors(nodes) {
            const keep = new Set();
            const visit = node => {
                if (keep.has(node.id())) return;
                keep.add(node.id());
                node.outgoers('edge').forEach(edge => visit(edge.target()));
            };
            nodes.forEach(visit);
            return keep;
        }

        // Recompute display from scratch rather than only ever hiding. This is
        // what lets the threshold slider work in both directions.
        function showOnly(idSet) {
            cy.nodes().style('display', 'none');
            cy.edges().style('display', 'none');
            idSet.forEach(id => cy.getElementById(id).style('display', 'element'));
            cy.edges().forEach(edge => {
                if (idSet.has(edge.source().id()) && idSet.has(edge.target().id())) {
                    edge.style('display', 'element');
                }
            });
        }

        // Show nodes at or below the current threshold, optionally keeping their
        // paths to the roots.
        //
        // allowFallback is for the initial render only: if nothing is significant
        // in this dataset we widen to p < 1 (then to everything) rather than
        // opening on a blank graph. It must stay off for user-driven changes --
        // otherwise dragging the slider to maximum stringency would flood the
        // view with every node instead of narrowing to none.
        function applyVisibility(allowFallback = false) {
            let passing = cy.nodes().filter(node => {
                const p = getP(node);
                return p != null && p <= pThreshold;
            });

            if (allowFallback && passing.length === 0) {
                passing = cy.nodes().filter(node => {
                    const p = getP(node);
                    return p != null && p < 1;
                });

                if (passing.length === 0) {
                    cy.nodes().style('display', 'element');
                    cy.edges().style('display', 'element');
                    return;
                }
            }

            const ids = keepPathsToRoot
                ? collectAncestors(passing)
                : new Set(passing.map(node => node.id()));
            showOnly(ids);
        }

        /////////
        // Threshold filter controls
        /////////

        const slider        = document.getElementById('p-threshold-slider');
        const thresholdOut  = document.getElementById('p-threshold-value');
        const pathsToggle   = document.getElementById('keep-paths-toggle');

        // Slider travels in exponent space (E), where threshold p = 10^-E, so the
        // orders of magnitude spread evenly instead of bunching near zero.
        // Span at least to p = 0.01 so the control stays usable on datasets whose
        // best p-value is weak.
        const sliderMax = Math.max(Math.ceil(maxExponent), 2);
        slider.max = sliderMax;
        document.getElementById('p-filter-max').textContent =
            `p = ${Math.pow(10, -sliderMax).toExponential(0)}`;

        // Push current state back into the controls, so menu actions and slider
        // never disagree.
        function syncFilterControls() {
            const exponent = pThreshold > 0 ? -Math.log10(pThreshold) : sliderMax;
            slider.value = Math.max(0, Math.min(sliderMax, exponent));
            thresholdOut.textContent = pThreshold.toExponential(1);
            pathsToggle.checked = keepPathsToRoot;
        }

        slider.addEventListener('input', () => {
            pThreshold = Math.pow(10, -parseFloat(slider.value));
            thresholdOut.textContent = pThreshold.toExponential(1);
            applyVisibility();
        });

        // Park the panel under the colour legend by default, measured rather
        // than hard-coded so it still lands correctly if the legend changes size.
        const panel  = document.getElementById('p-filter');
        const legend = document.getElementById('color-legend');
        panel.style.top = (legend.offsetTop + legend.offsetHeight + 10) + 'px';

        // Drag by the title bar only, so the slider and checkbox stay usable.
        (function makeDraggable(el, handle) {
            let dragging = false, grabX = 0, grabY = 0;

            handle.addEventListener('mousedown', e => {
                const box    = el.getBoundingClientRect();
                const bounds = el.offsetParent.getBoundingClientRect();
                grabX = e.clientX - box.left;
                grabY = e.clientY - box.top;
                // Switch from right-anchored to left-anchored, otherwise the
                // panel fights the drag.
                el.style.left   = (box.left - bounds.left) + 'px';
                el.style.top    = (box.top - bounds.top) + 'px';
                el.style.right  = 'auto';
                el.style.bottom = 'auto';
                dragging = true;
                e.preventDefault(); // no text selection while dragging
            });

            document.addEventListener('mousemove', e => {
                if (!dragging) return;
                const bounds = el.offsetParent.getBoundingClientRect();
                // Clamp inside the graph area so it can't be lost off-screen.
                const x = Math.max(0, Math.min(bounds.width  - el.offsetWidth,
                                               e.clientX - bounds.left - grabX));
                const y = Math.max(0, Math.min(bounds.height - el.offsetHeight,
                                               e.clientY - bounds.top  - grabY));
                el.style.left = x + 'px';
                el.style.top  = y + 'px';
            });

            document.addEventListener('mouseup', () => { dragging = false; });
        })(panel, panel.querySelector('.p-filter-handle'));

        pathsToggle.addEventListener('change', () => {
            keepPathsToRoot = pathsToggle.checked;
            applyVisibility();
        });

        // Default view: significant nodes plus their paths to the roots.
        // Fallback enabled so a dataset with nothing significant still renders.
        syncFilterControls();
        applyVisibility(true);

        // Show/hide nodes when respective menu item is clicked
        document.querySelectorAll('.show-hide-option').forEach(item => {
            item.addEventListener('click', e => {
                e.preventDefault(); // stop link navigation

                const action = e.target.dataset.action;

                switch(action) {
                    // One-off manual operations. The next threshold change
                    // recomputes visibility over the top of them.
                    case 'hide-unselected':
                        // Hide all nodes that are not selected
                        cy.nodes(':unselected').style('display', 'none');
                        // Also hide edges connected to hidden nodes
                        cy.nodes(':unselected').connectedEdges().style('display', 'none');
                        break;

                    case 'hide-selected':
                        // Hide all selected nodes
                        cy.nodes(':selected').style('display', 'none');
                        // Also hide edges connected to hidden nodes
                        cy.nodes(':selected').connectedEdges().style('display', 'none');
                        break;

                    case 'show-all':
                        // Show all nodes and edges
                        cy.nodes().style('display', 'element');
                        cy.edges().style('display', 'element');

                        // Hide leaf nodes with no p-value (all proper leaves)
                        cy.nodes().forEach(node => {
                            const p = getP(node);
                            if (p == null && node.indegree() === 0) {
                                node.style('display', 'none');
                                node.connectedEdges().style('display', 'none');
                            }
                        });
                        break;

                    case 'hide-labels':

                        labelsVisible = !labelsVisible;

                        cy.style()
                        .selector('node')
                        .style({
                            'label': labelsVisible ? 'data(short_label)' : ''
                        })
                        .update();

                        break;

                    case 'hide-non-significant':
                        // Reset the threshold to the conventional 0.05 and drop
                        // ancestors, matching this action's original behaviour.
                        pThreshold = 0.05;
                        keepPathsToRoot = false;
                        syncFilterControls();
                        applyVisibility();
                        break;

                    case 'show-significant-with-paths':
                        // Same threshold, but keep the paths connecting
                        // survivors up to the roots.
                        keepPathsToRoot = true;
                        syncFilterControls();
                        applyVisibility();
                        break;

                }
            });
        });


    });

</script>

</body>
</html>
