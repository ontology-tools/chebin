[project]
name = "chebin"
version = "1.0.1"
description = "Ontology-based chemical enrichment analysis using the ChEBI ontology"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "chebi",
  "cheminformatics",
  "enrichment-analysis",
  "fishers-exact-test",
  "ontology",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "flask>=3.1.3",
  "networkx>=3.6.1",
  "numpy>=2.5.2",
  "pandas>=3.0.5",
  "py-horned-owl>=1.4.1",
  "rdkit>=2026.3.5",
  "requests>=2.34.2",
  "scipy>=1.18.0",
]

[project.urls]
Changelog = "https://github.com/ontology-tools/chebin/blob/main/CHANGELOG.md"
Homepage = "https://chebin.hastingslab.org/"
Issues = "https://github.com/ontology-tools/chebin/issues"
Repository = "https://github.com/ontology-tools/chebin"

[dependency-groups]
dev = [
  "coverage>=7.15.4",
  "great-docs>=0.16.0",
  "prek>=0.4.13",
  "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.deptry]
ignore_notebooks = true
known_first_party = [
  "chebin",
  "calculations",
  "old_scripts",
  "preparing_data",
  "website"
]

[tool.deptry.package_module_name_map]
py-horned-owl = ["pyhornedowl"]

[tool.typos.default.extend-words]
# "cose" is the Cytoscape.js Compound Spring Embedder layout, not a typo of
# "case". Without this the typos hook rewrites it and breaks graph rendering
# in website/templates/graph.html (reverted before in 6f97f56 and 24db0a0).
cose = "cose"

[tool.uv]
package = true

# Everything under src/chebin/ ships by default. These are development leftovers
# that live inside the package tree but are not part of the library: without the
# excludes, plotting_children.ipynb alone was 183 KB of a 327 KB wheel.
[tool.uv.build-backend]
source-exclude = [
  "**/*.ipynb",
  "**/wikidata/test.py",
  "**/wikidata/data/**",
]
wheel-exclude = [
  "**/*.ipynb",
  "**/wikidata/test.py",
  "**/wikidata/data/**",
]
