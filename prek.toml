# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-ast" },
  { id = "check-builtin-literals" },
  { id = "check-case-conflict" },
  { id = "check-docstring-first" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-toml" },
  { id = "check-xml" },
  { id = "check-yaml" },
  { id = "check-json", exclude = "^.devcontainer/devcontainer.json" },
  {
    id = "pretty-format-json",
    exclude = "^.devcontainer/devcontainer.json",
    args = ["--autofix"]
  },
  { id = "debug-statements" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "pretty-format-json" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/openstack/bashate"
rev = "2.1.1"
hooks = [{ id = "bashate", args = ["--ignore=E003,E006"] }]

[[repos]]
repo = "https://github.com/fpgmaas/deptry"
rev = "0.25.1"
hooks = [
  {
    id = "deptry",
    language = "python",
    # Unpinned on purpose: prek installs the repo clone at `rev` above, and that
    # local path takes precedence, so this resolves to 0.25.1 already. Adding an
    # explicit `==0.25.1` here makes the resolve unsatisfiable.
    additional_dependencies = ["deptry"],
    exclude = '^(?!.*\.py$).*$'
  }
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.38.0"
hooks = [{ id = "check-github-workflows" }, { id = "check-taskfile" }]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.21.2"
hooks = [{ id = "pyupgrade" }]

[[repos]]
repo = "https://github.com/asottile/add-trailing-comma"
rev = "v4.0.0"
hooks = [{ id = "add-trailing-comma" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.2"
hooks = [{ id = "ruff-check", args = ["--fix"] }, { id = "ruff-format" }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.2.10"
hooks = [{ id = "tombi-format", exclude = '^uv\.lock$' }, { id = "tombi-lint" }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.49.0"
hooks = [{ id = "typos" }]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [{ id = "shellcheck" }]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.12.3"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "local"
hooks = [
  {
    id = "asciidoctor-lint",
    name = "asciidoctor-lint",
    language = "system",
    entry = "asciidoctor --failure-level=WARN -o /dev/null",
    files = '\.adoc$'
  },
  {
    id = "ty-check",
    name = "ty-check",
    language = "python",
    entry = "ty check src/chebin website",
    pass_filenames = false,
    exclude = '^(?!.*\.py$).*$',
    # All pinned deliberately. This hook has no `rev` to pin it, so unpinned
    # entries resolve to latest on every CI run while the local hook env stays
    # cached -- CI fails on diagnostics that cannot be reproduced locally.
    # The libraries below are type information, not just imports: new stubs
    # change inferred types and surface new diagnostics, so they pin too.
    # Versions match uv.lock, so ty sees what the code actually runs against.
    # Bump with `prek auto-update` (revs) plus a manual pass over this list.
    additional_dependencies = [
      "ty==0.0.79",
      "flask==3.1.3",
      "networkx==3.6.1",
      "numpy==2.5.2",
      "pandas==3.0.5",
      "pytest==9.1.1",
      "requests==2.34.2",
      "scipy==1.18.0",
      "py-horned-owl==1.4.1",
      "rdkit==2026.3.5"
    ]
  }
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.29.0"
hooks = [{ id = "zizmor", entry = "zizmor --fix=all ." }]

[[repos]]
repo = "https://github.com/jolars/panache-pre-commit"
rev = "v3.3.0"
hooks = [{ id = "panache-format" }, { id = "panache-lint" }]
